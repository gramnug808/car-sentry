; Car Sentry — ESP32 firmware (PlatformIO + Arduino)
; Standalone alarm / presence-sensor node for the user's OWN vehicle only.
; Defensive only: mmWave person detection, car-alarm mode, buzzer/siren,
; sleep/wake, ARM/DISARM/ALERT/WAKE/STATUS protocol over serial + MQTT/HTTP.
; NO wardriving, NO SDR, NO LPR, NO signal-intel code in this firmware.
; It talks to the host (a LAPTOP) only via the simple protocol documented
; in README.md and wiring.md.
;
; Build:  ~/.venvs/pio/bin/pio run -d .            (LD2410, default)
;         ~/.venvs/pio/bin/pio run -d . -e esp32-ld2450  (LD2450 option)
; Upload: ~/.venvs/pio/bin/pio run -d . -t upload
; Monitor: ~/.venvs/pio/bin/pio device monitor -b 115200
; Board: generic ESP32 dev board (ESP32-WROOM-32, classic ESP32 — no native USB).

[env:esp32-ld2410]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -DSENSOR_LD2410
lib_deps =
  bblanchon/ArduinoJson@^7.0.0
  knolleary/PubSubClient@^2.8

[env:esp32-ld2450]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -DSENSOR_LD2450
lib_deps =
  bblanchon/ArduinoJson@^7.0.0
  knolleary/PubSubClient@^2.8
